<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Student Academic Vault</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<header class="site-header">
  <a class="brand" href="index.html">
    <span class="brand-mark">SA</span>
    <span><strong>Student Academic Vault</strong><small>Your academic documents, one secure place.</small></span>
  </a>
</header>

<main class="simple-auth-shell">
<section class="auth-card simple-auth-card">
  <div class="verify-icon" aria-hidden="true"><span>✓</span></div>
  <span class="eyebrow">NEW PASSWORD</span>
  <h1>Create a new password.</h1>
  <p class="verify-lead">Choose a strong password you haven't used elsewhere.</p>

  <div id="resetMessage" class="form-message" role="alert" aria-live="polite"></div>

  <form id="resetForm" novalidate>
    <div class="field">
      <label for="newPassword">New password</label>
      <div class="password-wrap">
        <input id="newPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
        <button class="password-toggle" type="button" data-target="newPassword">Show</button>
      </div>
      <div class="password-meter" id="resetMeter" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <small id="resetHint" class="field-hint">Use 8+ characters with a mix of letters and numbers.</small>
      <small class="error" data-error-for="newPassword"></small>
    </div>

    <div class="field">
      <label for="resetConfirm">Confirm new password</label>
      <div class="password-wrap">
        <input id="resetConfirm" type="password" autocomplete="new-password" placeholder="Re-enter your password" required>
        <button class="password-toggle" type="button" data-target="resetConfirm">Show</button>
      </div>
      <small class="error" data-error-for="resetConfirm"></small>
    </div>

    <button class="primary-btn submit-btn" id="resetBtn" type="submit">
      <span>Reset password</span><span class="btn-arrow">→</span>
    </button>
  </form>

  <p class="auth-switch"><a href="login.html">Return to login</a></p>
</section>
</main>

<footer class="auth-footer">
  <span>© <span id="year"></span> Student Academic Vault</span>
  <span>Built for university students</span>
</footer>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script src="script.js"></script>
</body>
</html>
